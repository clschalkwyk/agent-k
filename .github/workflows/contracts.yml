name: API contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: contracts/requirements.txt
      - run: python -m pip install -r contracts/requirements.txt
      - run: python -m pytest -q tests/contracts/test_schema.py
