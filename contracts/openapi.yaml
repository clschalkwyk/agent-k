openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Agent K shared HTTP contract
  version: 0.1.0
  description: 'Procurement (A) and Fulfilment (B), separate stores and independent
    trust boundaries. Normative semantics: docs/API-CONTRACT.md. Synthetic data, XRPL
    Testnet only. No configured asset, funded wallet or deployed service is asserted
    by this document.'
tags:
- name: Procurement
  description: 'Developer A: requests, planning, mandates and signing controls.'
- name: Fulfilment
  description: 'Developer B: catalogue, rights, quotes, independent payment verification
    and execution.'
security:
- BearerAuth: []
paths:
  /v1/research-requests:
    post:
      operationId: createResearchRequest
      tags:
      - Procurement
      summary: Persist a synthetic research request in DRAFT
      description: Persist a synthetic research request in DRAFT.
      x-owner: Procurement
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Success
          headers:
            X-Correlation-ID:
              schema:
                $ref: '#/components/schemas/Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchRequest'
              example:
                request_id: req-001
                question: Compare synthetic VCAM-1 by BMI group
                population: Synthetic adult cohort
                variables:
                - bmi
                - vcam1
                purpose: academic_research
                operation: aggregate_analysis
                parameters:
                  obese_bmi_threshold: 30
                  biomarker: vcam1
                  method: mann_whitney_u_two_sided
                max_budget:
                  currency: XRP
                  value: '20.000000'
                status: DRAFT
                created_at: '2026-11-14T11:00:00Z'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResearchRequestCreate'
            example:
              request_id: req-001
              question: Compare synthetic VCAM-1 by BMI group
              population: Synthetic adult cohort
              variables:
              - bmi
              - vcam1
              purpose: academic_research
              operation: aggregate_analysis
              parameters:
                obese_bmi_threshold: 30
                biomarker: vcam1
                method: mann_whitney_u_two_sided
              max_budget:
                currency: XRP
                value: '20.000000'
